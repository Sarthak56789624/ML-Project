name: CardioCare CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cardiocare/backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd cardiocare/backend
          python -m pytest app/tests/test_api.py -v

  frontend-build:
    name: Frontend Lint, Test & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "cardiocare/frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd cardiocare/frontend
          npm ci

      - name: Run Vitest Component Tests
        run: |
          cd cardiocare/frontend
          npm test

      - name: Validate Production Build
        run: |
          cd cardiocare/frontend
          npm run build
